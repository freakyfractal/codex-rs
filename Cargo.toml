[package]
name = "codex-rs"
version = "0.1.0"
edition = "2021"
description = "A CLI tool for interacting with AI models from Replicate, Fal, and WaveSpeed"
authors = ["codex-rs contributors"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Interactive mode
dialoguer = "0.11"
console = "0.15"

# Progress indication
indicatif = "0.17"

# Error handling
anyhow = "1"
thiserror = "1"
async-trait = "0.1"

# Utilities
url = "2"
base64 = "0.22"
dirs = "5"
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
urlencoding = "2"
